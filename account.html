<!doctype html>
<html lang="en-CA">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Your account | Teebanj Fashion World</title>
    <meta
      name="description"
      content="African fabrics, ready-to-wear fashion and custom designs from Teebanj Fashion World, Moncton, Canada."
    />
    <link rel="icon" href="assets/site/product-placeholder.svg" />
    <link rel="manifest" href="manifest.webmanifest" />
    <meta name="theme-color" content="#963c2d" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link
      href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700;800&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="css/style.css" />
    <link rel="stylesheet" href="css/teebanj.css" />
  </head>
  <body>
    <div data-shell="header"></div>
    <main>
      <div class="page-head">
        <div class="wrap">
          <h1>Your account</h1>
          <p class="crumbs"><a href="index.html">Home</a> / Your account</p>
        </div>
      </div>
      <section>
        <div class="wrap">
          <div class="two-col" id="authForms">
            <form class="card" id="login">
              <h2>Welcome back</h2>
              <div class="field">
                <label for="loginEmail">Email</label
                ><input
                  id="loginEmail"
                  name="email"
                  type="email"
                  autocomplete="username"
                  required
                />
              </div>
              <div class="field">
                <label for="loginPassword">Password</label
                ><input
                  id="loginPassword"
                  name="password"
                  type="password"
                  autocomplete="current-password"
                  required
                />
              </div>
              <button type="submit" class="btn btn-primary">Sign in</button>
              <p role="status"></p>
              <p>
                <a href="contact.html">Need help accessing your account?</a>
              </p>
            </form>
            <form class="card" id="register">
              <h2>Create an account</h2>
              <div class="field">
                <label for="registerName">Full name</label
                ><input
                  id="registerName"
                  name="name"
                  maxlength="120"
                  autocomplete="name"
                  required
                />
              </div>
              <div class="field">
                <label for="registerEmail">Email</label
                ><input
                  id="registerEmail"
                  name="email"
                  type="email"
                  autocomplete="username"
                  required
                />
              </div>
              <div class="field">
                <label for="registerPassword"
                  >Password (12 characters minimum)</label
                ><input
                  id="registerPassword"
                  name="password"
                  type="password"
                  minlength="12"
                  maxlength="72"
                  autocomplete="new-password"
                  required
                />
              </div>
              <button type="submit" class="btn btn-primary">
                Create account
              </button>
              <p role="status"></p>
            </form>
          </div>
          <div id="signedIn" hidden>
            <h2 id="greeting"></h2>
            <button id="logout" class="btn btn-ghost">Sign out</button>
            <h3>Your orders</h3>
            <div id="orders"></div>
          </div>
          <p id="accountStatus" role="status"></p>
          <p>
            Guest checkout orders can be viewed using the order link in the same
            browser used for payment.
          </p>
        </div>
      </section>
    </main>
    <div data-shell="footer"></div>
    <script src="js/preview.js"></script>
    <script src="api/products.php"></script>
    <script src="js/products.js"></script>
    <script src="js/main.js"></script>
    <script src="js/api.js"></script>
    <script>
      document.addEventListener("DOMContentLoaded", async () => {
        async function show() {
          const s = await sessionInfo(true);
          document.getElementById("authForms").hidden = !!s.customer;
          document.getElementById("signedIn").hidden = !s.customer;
          if (s.customer) {
            document.getElementById("greeting").textContent =
              "Hello, " + s.customer.name;
            const { orders } = await api("my-orders");
            document.getElementById("orders").innerHTML = orders.length
              ? orders
                  .map(
                    (o) =>
                      `<p><a href="order.html?ref=${o.id}">${o.id}</a> · ${escapeHtml(o.status)} · ${money(o.total_cents / 100)}</p>`,
                  )
                  .join("")
              : "<p>No orders yet. Orders placed while signed in will appear here.</p>";
          }
        }
        formAction("login", "login", (f) => Object.fromEntries(f), show);
        formAction("register", "register", (f) => Object.fromEntries(f), show);
        document
          .getElementById("logout")
          .addEventListener("click", async () => {
            try {
              await api("logout", {});
              await show();
            } catch (e) {
              toast(e.message);
            }
          });
        try {
          await show();
        } catch (e) {
          document.getElementById("accountStatus").textContent = e.message;
        }
      });
    </script>
  </body>
</html>
