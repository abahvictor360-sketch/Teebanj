<!doctype html>
<html lang="en-CA">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Your bag | Teebanj Fashion World</title>
    <meta
      name="description"
      content="African fabrics, ready-to-wear fashion and custom designs from Teebanj Fashion World, Moncton, Canada."
    />
    <link rel="icon" href="assets/site/product-placeholder.svg" />
    <link rel="manifest" href="manifest.webmanifest" />
    <meta name="theme-color" content="#963c2d" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link
      href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700;800&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="css/style.css" />
    <link rel="stylesheet" href="css/teebanj.css" />
  </head>
  <body>
    <div data-shell="header"></div>
    <main>
      <div class="page-head">
        <div class="wrap">
          <h1>Your bag</h1>
          <p class="crumbs"><a href="index.html">Home</a> / Your bag</p>
        </div>
      </div>
      <section>
        <div class="wrap cart-layout">
          <div id="cartLines"></div>
          <aside class="summary">
            <h3>Your order</h3>
            <div class="summary-row">
              <span>Items subtotal</span><b id="subtotal"></b>
            </div>
            <p class="muted">
              Delivery and taxes are calculated for your province at checkout.
            </p>
            <a
              id="checkoutLink"
              class="btn btn-primary btn-block"
              href="checkout.html"
              >Continue to checkout →</a
            >
            <p><a href="shop.html">Keep shopping</a></p>
          </aside>
        </div>
      </section>
    </main>
    <div data-shell="footer"></div>
    <script src="js/preview.js"></script>
    <script src="api/products.php"></script>
    <script src="js/products.js"></script>
    <script src="js/main.js"></script>
    <script src="js/api.js"></script>
    <script>
      document.addEventListener("DOMContentLoaded", () => {
        function draw() {
          document.getElementById("cartLines").innerHTML = cart.length
            ? cart
                .map((l) => {
                  const p = PRODUCTS.find((p) => p.id === l.id);
                  return `<div class="cart-row"><img src="${escapeHtml(p ? img(p) : "assets/site/product-placeholder.svg")}" alt=""><div><b>${escapeHtml(p?.name || "Unavailable product")}</b><p>${p ? money(p.price) : "Remove this item"}</p></div><input aria-label="Quantity" type="number" min="1" max="99" value="${l.qty}" data-qty="${escapeHtml(l.id)}"><button class="btn btn-ghost btn-sm" data-remove="${escapeHtml(l.id)}">Remove</button></div>`;
                })
                .join("")
            : '<p>Your bag is empty. <a href="shop.html">Explore our collection.</a></p>';
          document.getElementById("subtotal").textContent = money(cartTotal());
          document.getElementById("checkoutLink").hidden = !cart.length;
        }
        document.getElementById("cartLines").addEventListener("click", (e) => {
          if (e.target.dataset.remove) {
            cart = cart.filter((l) => l.id !== e.target.dataset.remove);
            saveCart();
            draw();
          }
        });
        document.getElementById("cartLines").addEventListener("change", (e) => {
          if (e.target.dataset.qty) {
            const q = Number(e.target.value);
            if (!Number.isInteger(q) || q < 1 || q > 99) {
              draw();
              return;
            }
            cart.find((l) => l.id === e.target.dataset.qty).qty = q;
            saveCart();
            draw();
          }
        });
        draw();
      });
    </script>
  </body>
</html>
