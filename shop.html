<!doctype html>
<html lang="en-CA">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Shop | Teebanj Fashion World</title>
    <meta
      name="description"
      content="African fabrics, ready-to-wear fashion and custom designs from Teebanj Fashion World, Moncton, Canada."
    />
    <link rel="icon" href="assets/site/product-placeholder.svg" />
    <link rel="manifest" href="manifest.webmanifest" />
    <meta name="theme-color" content="#963c2d" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link
      href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700;800&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="css/style.css" />
    <link rel="stylesheet" href="css/teebanj.css" />
  </head>
  <body>
    <div data-shell="header"></div>
    <main>
      <div class="page-head">
        <div class="wrap">
          <h1>Shop the collection</h1>
          <p class="crumbs">
            <a href="index.html">Home</a> / Shop the collection
          </p>
        </div>
      </div>
      <section>
        <div class="wrap">
          <div class="shop-toolbar">
            <label
              >Category
              <select id="category">
                <option value="">All collections</option>
              </select></label
            ><label
              >Search
              <input
                id="search"
                type="search"
                placeholder="Find your style" /></label
            ><label
              >Sort
              <select id="sort">
                <option value="">Featured</option>
                <option value="low">Price: low to high</option>
                <option value="high">Price: high to low</option>
              </select></label
            >
          </div>
          <p class="muted" id="count"></p>
          <div id="grid" class="product-grid"></div>
        </div>
      </section>
    </main>
    <div data-shell="footer"></div>
    <script src="js/preview.js"></script>
    <script src="api/products.php"></script>
    <script src="js/products.js"></script>
    <script src="js/main.js"></script>
    <script src="js/api.js"></script>
    <script>
      document.addEventListener("DOMContentLoaded", () => {
        const params = new URLSearchParams(location.search);
        const category = document.getElementById("category");
        category.innerHTML += CATEGORIES.map(
          (c) => `<option value="${c.slug}">${c.name}</option>`,
        ).join("");
        category.value = params.get("cat") || "";
        document.getElementById("search").value = params.get("q") || "";
        function draw() {
          let list = PRODUCTS.filter(
            (p) =>
              (!category.value || p.cat === category.value) &&
              (p.name + " " + p.desc)
                .toLowerCase()
                .includes(
                  document.getElementById("search").value.toLowerCase(),
                ),
          );
          const sort = document.getElementById("sort").value;
          if (sort)
            list.sort((a, b) =>
              sort === "low" ? a.price - b.price : b.price - a.price,
            );
          document.getElementById("count").textContent =
            list.length + " product variations · CAD";
          renderGrid(document.getElementById("grid"), list);
        }
        ["category", "search", "sort"].forEach((id) =>
          document.getElementById(id).addEventListener("input", draw),
        );
        draw();
      });
    </script>
  </body>
</html>
