<!doctype html>
<html lang="en-CA">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Product | Teebanj Fashion World</title>
    <meta
      name="description"
      content="African fabrics, ready-to-wear fashion and custom designs from Teebanj Fashion World, Moncton, Canada."
    />
    <link rel="icon" href="assets/site/product-placeholder.svg" />
    <link rel="manifest" href="manifest.webmanifest" />
    <meta name="theme-color" content="#c4501a" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link
      href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="css/style.css" />
    <link rel="stylesheet" href="css/teebanj.css" />
    <link rel="stylesheet" href="css/refresh.css" />
  </head>
  <body>
    <div data-shell="header"></div>
    <main>
      <div class="page-head">
        <div class="wrap">
          <h1>The details</h1>
          <p class="crumbs"><a href="index.html">Home</a> / The details</p>
        </div>
      </div>
      <section>
        <div class="wrap"><div class="pdp" id="product"></div></div>
      </section>
    </main>
    <div data-shell="footer"></div>
    <script src="js/preview.js"></script>
    <script src="api/products.php"></script>
    <script src="js/products.js"></script>
    <script src="js/main.js"></script>
    <script src="js/api.js"></script>
    <script>
      document.addEventListener("DOMContentLoaded", () => {
        const p = PRODUCTS.find(
          (x) => x.id === new URLSearchParams(location.search).get("id"),
        );
        if (!p) {
          document.getElementById("product").textContent =
            "This product is unavailable. Please browse our current collection.";
          return;
        }
        document.title = p.name + " | Teebanj Fashion World";
        document.getElementById("product").innerHTML =
          `<img class="product-image" src="${escapeHtml(img(p))}" alt="${escapeHtml(p.name)}"><div><span class="eyebrow">${catName(p.cat)}</span><h1>${escapeHtml(p.name)}</h1><h2>${money(p.price)}</h2><p class="product-description">${escapeHtml(p.desc)}</p><p>Selected variation: <b>${escapeHtml(p.variation)}</b></p><p>${p.preview ? "Contact us for availability and options" : p.stock > 0 ? "Available to order" : "Currently unavailable online"}</p><label for="quantity">Quantity</label><input id="quantity" type="number" min="1" max="${Math.min(99, Math.floor(p.stock))}" value="1" style="width:90px"><p><button id="add" class="btn btn-primary" ${p.stock < 1 ? "disabled" : ""}>Add to bag</button></p><p>Delivery and applicable taxes are confirmed at checkout.</p><a href="contact.html">Need help with sizing or a custom design?</a></div>`;
        document
          .getElementById("add")
          .addEventListener("click", () =>
            addToCart(p.id, {
              qty: Number(document.getElementById("quantity").value),
            }),
          );
      });
    </script>
  </body>
</html>
