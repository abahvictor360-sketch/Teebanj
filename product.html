<!doctype html>
<html lang="en-CA">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Product | Teebanj Fashion World</title>
    <meta
      name="description"
      content="African fabrics, ready-to-wear fashion and custom designs from Teebanj Fashion World, Moncton, Canada."
    />
    <link rel="icon" href="assets/site/product-placeholder.svg" />
    <link rel="manifest" href="manifest.webmanifest" />
    <meta name="theme-color" content="#c4501a" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link
      href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="css/style.css" />
    <link rel="stylesheet" href="css/teebanj.css" />
    <link rel="stylesheet" href="css/refresh.css" />
  </head>
  <body>
    <div data-shell="header"></div>
    <main>
      <div class="page-head">
        <div class="wrap">
          <h1>The details</h1>
          <p class="crumbs"><a href="index.html">Home</a> / The details</p>
        </div>
      </div>
      <section>
        <div class="wrap"><div class="pdp" id="product"></div></div>
      </section>
    </main>
    <div data-shell="footer"></div>
    <script src="js/preview.js"></script>
    <script src="api/products.php"></script>
    <script src="js/products.js"></script>
    <script src="js/content.js"></script>
    <script src="js/main.js"></script>
    <script src="js/api.js"></script>
    <script>
      document.addEventListener("DOMContentLoaded", () => {
        const p = PRODUCTS.find(
          (x) => x.id === new URLSearchParams(location.search).get("id"),
        );
        if (!p) {
          document.getElementById("product").textContent =
            "This product is unavailable. Please browse our current collection.";
          return;
        }
        document.title = p.name + " | Teebanj Fashion World";
        const avail = p.preview
          ? '<span class="pill-s pending">Enquire for availability</span>'
          : p.stock > 0
            ? `<span class="pill-s paid">${p.stock <= 3 ? "Only " + Number(p.stock) + " left" : "In stock"}</span>`
            : '<span class="pill-s out">Sold out</span>';
        const buy = p.preview
          ? `<div class="pdp-buy"><a class="btn btn-primary" href="contact.html">Enquire about this piece</a><a class="btn btn-ghost" href="${waLink("Hello Teebanj, I am interested in " + p.name)}" target="_blank" rel="noopener">${icon("chat")}WhatsApp us</a></div>`
          : `<div class="pdp-buy"><label class="qty"><span class="sr-only">Quantity</span><input id="quantity" type="number" inputmode="numeric" min="1" max="${Math.max(1, Math.min(99, Math.floor(p.stock)))}" value="1" ${p.stock < 1 ? "disabled" : ""}></label><button id="add" class="btn btn-primary" ${p.stock < 1 ? "disabled" : ""}>${icon("bag")}Add to bag</button></div>`;
        document.getElementById("product").innerHTML =
          `<div class="pdp-media"><img class="product-image" src="${escapeHtml(img(p))}" alt="${escapeHtml(p.name)}"></div><div class="pdp-info"><span class="eyebrow">${catName(p.cat)}</span><h1>${escapeHtml(p.name)}</h1><p class="pdp-price">${money(p.price)}</p>${avail}${p.desc ? `<p class="product-description">${escapeHtml(p.desc)}</p>` : ""}<p class="muted">Option: <b>${escapeHtml(p.variation)}</b></p>${buy}<ul class="pdp-notes"><li>${icon("shield")}Secure payment with Square</li><li>${icon("truck")}Delivery and taxes confirmed at checkout</li><li>${icon("scissors")}<a href="custom.html">Need a custom size or design?</a></li></ul></div>`;
        document
          .getElementById("add")
          ?.addEventListener("click", () =>
            addToCart(p.id, {
              qty: Number(document.getElementById("quantity").value),
            }),
          );
      });
    </script>
  </body>
</html>
