<!doctype html>
<html lang="en-CA">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Contact us | Teebanj Fashion World</title>
    <meta
      name="description"
      content="African fabrics, ready-to-wear fashion and custom designs from Teebanj Fashion World, Moncton, Canada."
    />
    <link rel="icon" href="assets/site/product-placeholder.svg" />
    <link rel="manifest" href="manifest.webmanifest" />
    <meta name="theme-color" content="#c4501a" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link
      href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="css/style.css" />
    <link rel="stylesheet" href="css/teebanj.css" />
    <link rel="stylesheet" href="css/refresh.css" />
  </head>
  <body>
    <div data-shell="header"></div>
    <main>
      <div class="page-head">
        <div class="wrap">
          <h1 data-cms="contact.title">Let's talk</h1>
          <p class="crumbs"><a href="index.html">Home</a> / <span data-cms="contact.title">Let's talk</span></p>
        </div>
      </div>
      <section>
        <div class="wrap two-col">
          <form class="card" id="contact">
            <h2>Send us a message</h2>
            <div class="field">
              <label for="name">Name</label
              ><input name="name" id="name" maxlength="120" required />
            </div>
            <div class="field">
              <label for="email">Email</label
              ><input name="email" id="email" type="email" required />
            </div>
            <div class="field">
              <label for="subject">Subject</label
              ><select name="subject" id="subject">
                <option>Order question</option>
                <option>Custom design</option>
                <option>Aso Ebi enquiry</option>
                <option>Returns</option>
                <option>Account help</option>
              </select>
            </div>
            <div class="field">
              <label for="message">Message</label
              ><textarea
                name="message"
                id="message"
                rows="6"
                maxlength="5000"
                required
              ></textarea>
            </div>
            <button class="btn btn-primary" type="submit">Send message</button>
            <p role="status"></p>
          </form>
          <aside class="card contact-card">
            <span class="eyebrow">Teebanj Fashion World</span>
            <h2 data-cms="contact.heading"></h2>
            <div class="foot-contact" id="contactDetails"></div>
          </aside>
        </div>
      </section>
      <section id="faq">
        <div class="wrap content-page">
          <h2>Good to know</h2>
          <div class="faq" id="faqList"></div>
        </div>
      </section>
    </main>
    <div data-shell="footer"></div>
    <script src="js/preview.js"></script>
    <script src="api/products.php"></script>
    <script src="js/products.js"></script>
    <script src="js/content.js"></script>
    <script src="js/main.js"></script>
    <script src="js/api.js"></script>
    <script>
      document.addEventListener("DOMContentLoaded", () => {
        document.getElementById("contactDetails").innerHTML = `<span>${icon("pin")}${lines(cms("contact.address"))}</span><a href="${telLink()}">${icon("phone")}${escapeHtml(cms("contact.phone"))}</a><a href="mailto:${escapeHtml(cms("contact.email"))}">${icon("mail")}${escapeHtml(cms("contact.email"))}</a><span>${icon("clock")}<span>${lines(cms("contact.hours"))}</span></span><a class="btn btn-primary" href="${waLink()}" target="_blank" rel="noopener">Chat on WhatsApp</a>`;
        document.getElementById("faqList").innerHTML = cms("contact.faq")
          .map((f, i) => `<details ${i ? "" : "open"}><summary>${escapeHtml(f.q)}</summary><p>${escapeHtml(f.a)}</p></details>`)
          .join("");
        formAction("contact", "contact", (f) => Object.fromEntries(f), (_, f) => {
          f.reset();
          toast("Thank you. We have received your message.");
        });
      });
    </script>
  </body>
</html>
